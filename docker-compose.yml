services:
  deebee:
    image: ghcr.io/yacki/deebee:${DEEBEE_IMAGE_TAG:-latest}
    build:
      context: .
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DEEBEE_CONNECTIONS_FILE: /app/data/connections.json
      DEEBEE_SECRET_FILE: /app/data/secret.key
    ports:
      - "${DEEBEE_BIND_ADDRESS:-127.0.0.1}:${DEEBEE_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEEBEE_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
